name: Daily YouTube Video

on:
  schedule:
    - cron: "0 14 * * *"   # runs daily at 14:00 UTC — change if you want a different time
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-${{ runner.os }}-${{ hashFiles('.github/workflows/daily_video.yml') }}
          restore-keys: |
            apt-ffmpeg-${{ runner.os }}-

      - name: Install ffmpeg (skip if already present)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily video pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py
