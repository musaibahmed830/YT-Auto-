name: Daily YouTube Video

on:
  schedule:
    - cron: "0 14 * * *"   # runs daily at 14:00 UTC — change if you want a different time
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab, with inputs below
    inputs:
      topic_mode:
        description: "How to pick today's topic"
        type: choice
        default: trending
        options:
          - trending
          - category
          - custom
      category:
        description: "Category to pick from (used only if topic_mode = category)"
        type: choice
        default: any
        options:
          - any
          - facts
          - science
          - history
          - motivation
          - finance
          - animals
      custom_topic:
        description: "Exact topic to use (used only if topic_mode = custom)"
        type: string
        default: ""
      video_mode:
        description: "Upload as a regular video or a YouTube Short"
        type: choice
        default: video
        options:
          - video
          - shorts

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (skip if already present)
        timeout-minutes: 3
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-en_US-lessac-medium-v1

      - name: Run daily video pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Only present on manual "Run workflow" runs; scheduled runs get
          # the defaults below (i.e. always "trending" on the daily cron).
          TOPIC_MODE: ${{ github.event.inputs.topic_mode || 'trending' }}
          TOPIC_CATEGORY: ${{ github.event.inputs.category || 'any' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'video' }}
        run: python main.py
